[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tolvyn"
version = "0.1.10"
description = "Drop-in replacement for the OpenAI/Anthropic/Google/DeepSeek SDKs — routes through TOLVYN for cost attribution, budget enforcement, and audit logging."
readme = "README.md"
requires-python = ">=3.9"
# A SPDX STRING, NOT A TOML TABLE. setuptools deprecated the table form and
# names a deadline -- "By 2027-Feb-18, you need to update your project and
# remove deprecated calls" -- so the build has been printing a
# SetuptoolsDeprecationWarning on every wheel. BE-490.
license = "MIT"
# `license-files` is NOT set, and that is deliberate rather than forgotten:
# THERE IS NO LICENSE FILE IN THIS REPOSITORY. Adding the key would fail the
# build, and writing the file would mean inventing a copyright holder -- which
# is a legal statement, not a packaging fix. README.md's own
# [License: MIT](LICENSE) badge therefore links to a file that does not exist,
# on PyPI as well as on GitHub. BE-491.
dependencies = [
    "openai>=1.0.0",
    "anthropic>=0.20.0",
    # BE-488: tolvyn/_client.py, _anthropic.py, _deepseek.py and _failopen.py
    # all `import httpx` and it was never declared. It worked by accident while
    # `openai` happened to depend on httpx; openai 3.x declares `httpx2`
    # instead, so a clean `pip install tolvyn` now resolves WITHOUT httpx and
    # `from tolvyn import OpenAI` raises ModuleNotFoundError.
    #
    # THE LOWER BOUND IS CHOSEN FROM WHAT THE CODE USES, not guessed: Client,
    # AsyncClient, HTTPTransport, AsyncHTTPTransport, Request, Response, URL,
    # HTTPStatusError, ConnectError, ConnectTimeout, ReadTimeout, WriteTimeout,
    # RemoteProtocolError. The custom-transport surface settled in 0.23 and all
    # of those names have been stable since; there is no upper bound because
    # nothing here touches an API httpx has signalled it will change.
    "httpx>=0.23",
]

[project.optional-dependencies]
google = ["google-generativeai>=0.5.0"]
dev = ["pytest>=7.0", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tolvyn*"]

[tool.pytest.ini_options]
markers = ["integration: requires live proxy and real API keys"]
